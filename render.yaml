# Sentinel Mesh — Render deployment blueprint (no-card / free-tier edition).
#
# Deploys from the connected GitHub repository (see docs/SETUP.md):
#   - sentinel-mesh-orchestrator merged backend service        (Docker, /health)
#     (also serves the retired sentinel-mesh-api surface: agents,
#      signals, tokens/evidence/risk/whales/fees, portfolio)
#
# Data stores (Render-managed Postgres/Key Value require a payment card, so
# they are NOT defined here — use the free tiers of Neon (Postgres) and
# Upstash (Redis) instead; both are card-free):
#   - DATABASE_URL  set in the Render dashboard (Neon connection string)
#   - REDIS_URL     set in the Render dashboard (Upstash URL; OPTIONAL —
#                   the services fall back to in-memory queues without it)
#
# Free-tier caveats (documented in docs/SECURITY-AUDIT.md):
#   - Free web services sleep after ~15 min without traffic and lose
#     in-process guard state (idempotency cache, spend-cap counters).
#     Postgres remains the source of truth for processed events, but live
#     trading later requires a paid "starter" instance (no sleeping).
#   - EXECUTION_MODE stays "paper" — live trading is rejected by config.
#   - ALLOWED_ORIGINS locks browser CORS to the Vercel dashboard origin.
#     Put Cloudflare Access in front of the two public URLs before opening
#     them up.

services:
  # -------------------------------------------------------- ORCHESTRATOR
  - type: web
    name: sentinel-mesh-orchestrator
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.orchestrator
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ORCHESTRATOR_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CHAIN_ADAPTER_MODE
        value: mock
      - key: POLICY_MODE
        value: dry-run
      - key: EXECUTION_MODE
        value: paper
      - key: POLICY_MAX_NOTIONAL_USD_CENTS
        value: "50000"
      - key: ALLOWED_ORIGINS
        value: https://sentinel-mesh-phi.vercel.app
